[package]
name = "kindle-turbo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Conversor EPUB/manhwa para AZW3 (Kindle) ultra rapido"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
html-escape = "0.3.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
jpeg-encoder = "0.7.1"
memchr = "2.8.3"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
rayon = "1.12.0"
regex = "1.13.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
